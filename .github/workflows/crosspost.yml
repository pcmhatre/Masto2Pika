name: Crosspost Mastodon to Pika

on:
  # Triggered by the Cloudflare Worker in cron-trigger/ on a real */15 min
  # schedule — GitHub's own `schedule:` trigger proved too unreliable here
  # (only fired a couple of times over several hours).
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run crosspost
        env:
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_ACCOUNT_ID: ${{ secrets.MASTODON_ACCOUNT_ID }}
          PIKA_TOKEN: ${{ secrets.PIKA_TOKEN }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/thread-map.json
          git diff --cached --quiet || git commit -m "Update crosspost state"
          git push

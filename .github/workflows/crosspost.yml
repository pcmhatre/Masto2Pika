name: Crosspost Mastodon to Pika

on:
  # Triggered by the Cloudflare Worker in cron-trigger/ on a real */15 min
  # schedule — GitHub's own `schedule:` trigger proved too unreliable here
  # (only fired a couple of times over several hours).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no posts/writes)"
        required: false
        type: boolean
        default: false
      backfill:
        description: "Backfill (process full history instead of just new statuses) — only meaningful with dry_run"
        required: false
        type: boolean
        default: false

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run crosspost -- ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.backfill && '--backfill' || '' }}
        env:
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_ACCOUNT_ID: ${{ secrets.MASTODON_ACCOUNT_ID }}
          PIKA_TOKEN: ${{ secrets.PIKA_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXCLUDED_CONTENT: ${{ secrets.EXCLUDED_CONTENT }}
